name: snyk-agent-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: snyk-agent-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      SNYK_AGENT_SCAN_VERSION: "0.5.1"
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      with:
        python-version: ${{ env.UV_PYTHON }}
        enable-cache: false

    - name: Cache uv tool env
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ env.UV_PYTHON }}-snyk-agent-scan-${{ env.SNYK_AGENT_SCAN_VERSION }}

    - name: Run snyk-agent-scan on skills
      if: ${{ !cancelled() }}
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        set -euo pipefail

        # Scan a single markdown file, re-keying the JSON by the file path so
        # same-named files (e.g. multiple references/*/index.md) can't collide
        # when merged into the per-skill report. Writes re-keyed JSON to $2.
        scan_markdown() {
          local md_file="$1"
          local out="$2"
          local raw
          raw=$(mktemp)

          if ! uvx snyk-agent-scan@${SNYK_AGENT_SCAN_VERSION} "$md_file" --skills --json 2>/dev/null > "$raw"; then
            echo "Retrying ${md_file} in 5s..."
            sleep 5
            if ! uvx snyk-agent-scan@${SNYK_AGENT_SCAN_VERSION} "$md_file" --skills --json 2>/dev/null > "$raw"; then
              rm -f "$raw"
              return 1
            fi
          fi

          jq --arg f "$md_file" \
            'if type=="object" then (to_entries | map(.key = ($f + "::" + .key)) | from_entries) else {($f): {issues: .}} end' \
            "$raw" > "$out"
          rm -f "$raw"
        }

        # Scan all skills on both PRs and pushes to main
        SKILL_DIRS=$(find plugins/*/skills -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort)

        if [ -z "$SKILL_DIRS" ]; then
          echo "No skills to scan"
          echo '{}' > snyk-agent-scan-skills.json
          exit 0
        fi

        echo "Skills to scan:"
        echo "$SKILL_DIRS"

        EXIT_CODE=0
        while IFS= read -r skill_dir; do
          if [ ! -f "${skill_dir}/SKILL.md" ]; then
            echo "Skipping deleted or non-existent skill: ${skill_dir}"
            continue
          fi

          skill_name=$(echo "$skill_dir" | tr '/' '-')
          echo "Scanning ${skill_dir} (SKILL.md + references)..."

          # Scan every markdown file in the skill — SKILL.md is the entry point,
          # but references/ hold the content agents load at runtime, so a URL in
          # a reference file must be scanned too (previously only SKILL.md was).
          part_dir=$(mktemp -d)
          i=0
          while IFS= read -r md_file; do
            scan_markdown "$md_file" "${part_dir}/part-${i}.json" || EXIT_CODE=1
            i=$((i + 1))
          done < <(find "$skill_dir" -type f -name '*.md' | sort)

          # Merge all per-file results into the single per-skill report. The name
          # is unchanged so check_snyk_findings.py's skill-name extraction and the
          # ignore list keep resolving to the skill (e.g. "auth0").
          jq -s 'reduce .[] as $o ({}; . + $o)' "${part_dir}"/part-*.json \
            > "snyk-agent-scan-skill-${skill_name}.json"
          rm -rf "$part_dir"
        done <<< "$SKILL_DIRS"

        exit $EXIT_CODE

    - name: Combine scan results
      if: ${{ !cancelled() }}
      run: cat snyk-agent-scan-*.json > snyk-agent-scan-combined.json 2>/dev/null || true

    - name: Fail on High or Critical findings
      if: ${{ !cancelled() }}
      run: python3 scripts/check_snyk_findings.py

    - name: Upload report artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snyk-agent-scan-reports
        path: snyk-agent-scan-*.json
        if-no-files-found: error