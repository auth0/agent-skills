name: snyk-agent-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: snyk-agent-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      SNYK_AGENT_SCAN_VERSION: "0.5.1"
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      with:
        python-version: ${{ env.UV_PYTHON }}
        enable-cache: false

    - name: Cache uv tool env
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ env.UV_PYTHON }}-snyk-agent-scan-${{ env.SNYK_AGENT_SCAN_VERSION }}

    - name: Test finding-gate parsing
      run: |
        cd scripts
        uv run --with pytest python -m pytest test_check_snyk_findings.py -q

    - name: Run agent-scan + finding gate
      if: ${{ !cancelled() }}
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: make scan

    - name: Combine scan results
      if: ${{ !cancelled() }}
      run: cat snyk-agent-scan-*.json > snyk-agent-scan-combined.json 2>/dev/null || true

    - name: Upload report artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snyk-agent-scan-reports
        path: snyk-agent-scan-*.json
        if-no-files-found: error